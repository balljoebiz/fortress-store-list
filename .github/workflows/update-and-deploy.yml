name: 每日更新豐澤分店清單

on:
  schedule:
    # 香港時間每日 08:00 (UTC 00:00) 執行一次
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fortress-store-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 抓取並生成 HTML
        run: node build-fortress-html.js .

      - name: 檢查是否有變更
        id: changes
        run: |
          if git diff --quiet index.html fortress-stores.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交更新
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fortress-stores.json
          git commit -m "每日更新分店資料 $(date -u +'%Y-%m-%d')"
          git push
